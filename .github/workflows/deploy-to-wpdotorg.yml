name: Deploy to WordPress.org

on:
  push:
    tags:
      - "*"

jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          dev: no
          version: 2
          php_version: '8.0'

      - name: Setup Node
        uses: actions/setup-node@v1
        with:
          node-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare release build
        run: npm run gh:release

      - name: Verify Freemius build artifact
        run: test -f build/analogwp-templates/vendor/freemius/wordpress-sdk/start.php

      - name: Verify scoped autoloader build artifact
        run: test -f build/analogwp-templates/third-party/vendor/scoper-autoload.php

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@master
        env:
          BUILD_DIR: ./build/analogwp-templates
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
