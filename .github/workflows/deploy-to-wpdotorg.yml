name: Deploy to WordPress.org

on:
  push:
    tags:
      - "*"

jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version numbers match the tag
        run: |
          grep -Eq "^ \* Version: +${GITHUB_REF_NAME}$" analogwp-templates.php
          grep -q "^define( 'ANG_VERSION', '${GITHUB_REF_NAME}' );$" analogwp-templates.php
          grep -q "^Stable tag: ${GITHUB_REF_NAME}$" readme.txt

      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          dev: no
          version: 2
          php_version: '8.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare release build
        run: npm run gh:release

      - name: Verify Freemius build artifact
        run: test -f build/analogwp-templates/vendor/freemius/wordpress-sdk/start.php

      - name: Verify scoped autoloader build artifact
        run: test -f build/analogwp-templates/third-party/vendor/scoper-autoload.php

      - name: Verify unscoped dependencies are left out of the build
        run: test ! -e build/analogwp-templates/vendor/enshrined

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          BUILD_DIR: ./build/analogwp-templates
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
